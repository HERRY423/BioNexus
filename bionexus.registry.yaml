# ==============================================================================
# BioNexus Canonical Platform & MCP Server Registry
# Single Source of Truth (SSOT) for all client manifests & adapters
# ==============================================================================

package:
  name: "bionexus-reliability"
  display_name: "BioNexus"
  version: "1.0.0-rc.5"
  description: "Scientific Reliability Layer & Scientific Warrant Engine for AI Agents (Warrant-First Evidence Assessment, Fail-Closed Invariants, Evidence-Capped Claims, Zero Silent Substitution)."
  author:
    name: "BioNexus Team"
  license: "Apache-2.0"
  keywords:
    - "bionexus"
    - "bioinformatics"
    - "single-cell"
    - "scanpy"
    - "scvi-tools"
    - "nextflow"
    - "nf-core"
    - "allotrope"
    - "mcp"
    - "variant-interpretation"
    - "spatial-transcriptomics"
    - "squidpy"

mcp_servers:
  local:
    bionexus-local-mcp:
      enabled: true
      type: "stdio"
      command: "python"
      args:
        - "${PLUGIN_ROOT}/scripts/local_mcp_server.py"
        - "--audit-log"
        - "${PLUGIN_ROOT}/.bionexus-audit/mcp-host-audit.jsonl"
      cwd: "${PLUGIN_ROOT}"
      description: "BioNexus local fallback MCP server with a fail-closed, tamper-evident host-probe audit log"

  # ----------------------------------------------------------------------------
  # Architectural Notice: BioNexus Core knows only the protocol and does not
  # act as an MCP router or marketplace. The endpoints listed below under
  # 'hosted' are legacy transport placeholders. Canonical scientific contracts
  # for connector output are maintained declaratively by the community in the
  # Connector Profile Registry (standards/connector-profiles/profiles/).
  # ----------------------------------------------------------------------------
  hosted:
    pubmed:
      name: "NCBI PubMed"
      url: "https://pubmed.mcp.claude.com/mcp"
      type: "streamable-http"
      claude_type: "http"
      enabled: true
      bundle_with_plugin: false
      category: "literature"
      description: "Biomedical literature citations and abstracts from PubMed"

    biorender:
      name: "BioRender"
      url: "https://mcp.services.biorender.com/mcp"
      type: "streamable-http"
      claude_type: "http"
      enabled: true
      bundle_with_plugin: false
      category: "visualization"
      description: "Scientific illustration and diagram generation"

    biorxiv:
      name: "bioRxiv / medRxiv"
      url: "https://hcls.mcp.claude.com/biorxiv/mcp"
      type: "streamable-http"
      claude_type: "http"
      enabled: true
      bundle_with_plugin: false
      category: "preprints"
      description: "Preprint servers for biology and medicine via Europe PMC"

    consensus:
      name: "Consensus"
      url: "https://mcp.consensus.app/mcp"
      type: "streamable-http"
      claude_type: "http"
      enabled: true
      bundle_with_plugin: false
      category: "literature"
      description: "AI-powered scientific research consensus search"

    c-trials:
      name: "ClinicalTrials.gov"
      url: "https://hcls.mcp.claude.com/clinical_trials/mcp"
      type: "streamable-http"
      claude_type: "http"
      enabled: true
      bundle_with_plugin: false
      category: "clinical"
      description: "Clinical study protocols and results registry from ClinicalTrials.gov"

    chembl:
      name: "ChEMBL"
      url: "https://hcls.mcp.claude.com/chembl/mcp"
      type: "streamable-http"
      claude_type: "http"
      enabled: true
      bundle_with_plugin: false
      category: "chemistry"
      description: "Bioactive molecules, targets, and drug discovery bioactivities database"

    synapse:
      name: "Synapse Sage Bionetworks"
      url: "https://mcp.synapse.org/mcp"
      type: "streamable-http"
      claude_type: "http"
      enabled: true
      bundle_with_plugin: false
      category: "data_repository"
      description: "Collaborative biomedical data sharing platform"

    wiley:
      name: "Wiley Online Library"
      url: "https://connector.scholargateway.ai/mcp"
      type: "streamable-http"
      claude_type: "http"
      enabled: true
      bundle_with_plugin: false
      category: "literature"
      description: "Scientific literature connector for Wiley journals"

    owkin:
      name: "Owkin"
      url: "https://mcp.k.owkin.com/mcp"
      type: "streamable-http"
      claude_type: "http"
      enabled: true
      bundle_with_plugin: false
      category: "precision_medicine"
      description: "AI platform for precision medicine and oncology"

    ot:
      name: "Open Targets"
      url: "https://mcp.platform.opentargets.org/mcp"
      type: "streamable-http"
      claude_type: "http"
      enabled: true
      bundle_with_plugin: false
      category: "target_discovery"
      description: "Drug target discovery and validation platform"

    benchling:
      name: "Benchling"
      url: ""
      type: "streamable-http"
      claude_type: "http"
      enabled: false
      category: "lims"
      description: "Life sciences R&D informatics cloud platform (endpoint placeholder - disabled)"

clients:
  agent_plugins:
    plugin_manifest: "plugin.json"
    mcp_manifest: "mcp.json"
    marketplace_manifest: "marketplace.json"
  claude:
    plugin_manifest: ".claude-plugin/plugin.json"
    mcp_manifest: ".mcp.json"
    marketplace_manifest: ".claude-plugin/marketplace.json"
  codex:
    config_path: ".codex/config.json"
    marketplace_manifest: ".agents/plugins/marketplace.json"

skills:
  canonical:
    - name: "single-cell-rna-qc"
      tier: "core"
      grade: "A"
      backend: "scanpy + pydeseq2"
      description: "scverse gold chain: inspect, MAD QC, scrublet, preprocess, Leiden, markers, pseudobulk, pydeseq2"
    - name: "spatial-transcriptomics"
      tier: "core"
      grade: "A"
      backend: "squidpy"
      description: "squidpy gold chain: knn graph, Moran SVGs, spatial_scatter plots"
    - name: "scvi-tools"
      tier: "core"
      grade: "A"
      backend: "scvi-tools"
      description: "Probabilistic deep generative VAE modeling on raw count single-cell data"
    - name: "nextflow-development"
      tier: "core"
      grade: "A"
      backend: "nf-core + Nextflow"
      description: "nf-core samplesheet generation, pipeline launch artifacts, Nextflow config"
    - name: "instrument-data-to-allotrope"
      tier: "wrapper"
      grade: "A"
      backend: "allotropy + YAML engine"
      description: "Standardize analytical instrument outputs to Allotrope ASM JSON"
    - name: "provenance-and-audit"
      tier: "wrapper"
      grade: "B"
      backend: "bionexus.provenance"
      description: "Cryptographic SHA-256 hashes, environment snapshot, W3C PROV-O sidecars"
    - name: "external-evidence-audit"
      tier: "wrapper"
      grade: "B"
      backend: "bionexus.ecosystem_intake"
      description: "Passive, content-bound intake audit for results returned by external scientific capabilities"
    - name: "start"
      tier: "outline"
      grade: "outline"
      backend: "none"
      description: "Session orientation, capability survey, and doctor preflight"
    - name: "scientific-problem-selection"
      tier: "outline"
      grade: "outline"
      backend: "references/"
      description: "Research problem selection, project risk evaluation, and decision trees"

  heuristics:
    - name: "variant-interpretation"
      tier: "heuristic"
      grade: "C"
      backend: "local combiner + PWM splice"
      description: "Deterministic ACMG combination and splice site heuristics (Research Use Only)"
    - name: "protein-structure-analysis"
      tier: "heuristic"
      grade: "C"
      backend: "RCSB/AF HTTP + Kabsch"
      description: "PDB/AlphaFold geometry, Kabsch superposition, AutoDock Vina configs"
    - name: "protein-language-models"
      tier: "heuristic"
      grade: "refuse"
      backend: "transformers/esm (optional) / BLOSUM62"
      description: "ESM-2 zero-shot variant scoring with BLOSUM62 heuristic fallback"
    - name: "biologics-design"
      tier: "heuristic"
      grade: "C"
      backend: "abnumber (optional) + sequence motifs"
      description: "Fv liability scanning, IMGT numbering, codon optimization"
    - name: "clinical-cohort-analysis"
      tier: "heuristic"
      grade: "C"
      backend: "lifelines (optional) + scipy"
      description: "Kaplan-Meier survival estimation, log-rank tests, Cohen's d effect sizes"
    - name: "multiome-integration"
      tier: "heuristic"
      grade: "C"
      backend: "sklearn ExtraTrees"
      description: "Linear multimodal fusion and co-expression scoring"

  outlines:
    - name: "experiment-design-agent"
      tier: "outline"
      grade: "outline"
      backend: "none"
      description: "5-phase biomedical study outline and keyword routing template"
    - name: "research-workflow-orchestrator"
      tier: "outline"
      grade: "outline"
      backend: "local MCP (optional)"
      description: "YAML DAG workflow orchestration across local MCP tools"
    - name: "knowledge-graph-augmentation"
      tier: "outline"
      grade: "outline"
      backend: "in-memory dict"
      description: "In-memory biological knowledge graph entity and relationship manager"
