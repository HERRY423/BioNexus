[mypy]
python_version = 3.10
files = src/bionexus/contracts.py, src/bionexus/evidence_model.py, src/bionexus/warrant.py, src/bionexus/claim_semantics.py, src/bionexus/de_audit.py, src/bionexus/de_bundle.py
follow_imports = silent
check_untyped_defs = True
disallow_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
cache_dir = .mypy_cache
no_site_packages = True

# Numeric/library dependencies are opaque at this initial type boundary.
# Internal imports are followed; all six explicit core files remain blocking.
[mypy-numpy.*,pandas.*,scipy.*,yaml.*,anndata.*]
ignore_missing_imports = True
