[mypy]
python_version = 3.10
files = src/bionexus/contracts.py, src/bionexus/evidence_model.py, src/bionexus/warrant.py, src/bionexus/claim_semantics.py, src/bionexus/de_audit.py, src/bionexus/de_bundle.py, src/bionexus/integrity.py, src/bionexus/lab_policy.py, src/bionexus/research_purpose.py, src/bionexus/rule_classification.py, src/bionexus/rule_provenance.py, src/bionexus/researcher_override.py, src/bionexus/pseudobulk_warrant.py, src/bionexus/de_pilot.py, src/bionexus/pilot_costs.py, src/bionexus/spec_registry.py, src/bionexus/contract_traceability.py, src/bionexus/de_audit_extract.py, src/bionexus/validation_history.py, src/bionexus/validation_runs.py, src/bionexus/release_contract.py
follow_imports = silent
check_untyped_defs = True
disallow_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
cache_dir = .mypy_cache
no_site_packages = True

# Numeric/library dependencies are opaque at this initial type boundary.
# Internal imports are followed; all explicit core files remain blocking.
[mypy-numpy.*,pandas.*,scipy.*,yaml.*,anndata.*,sklearn.*,scanpy.*]
ignore_missing_imports = True
