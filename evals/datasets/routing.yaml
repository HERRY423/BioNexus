# ==============================================================================
# BioNexus Benchmark: Routing & Capability Discovery Suite
# ==============================================================================

- id: route-scrna-de-001
  category: routing
  prompt: "Compare differential expression between drug-treated and vehicle control cells in scRNA-seq dataset"
  expected_status: PERMITTED
  expected_capability: scrna.pseudobulk_de
  data_metadata:
    min_replicates_per_condition: 3
    is_integer_like: true
  description: "Direct condition differential expression with sufficient replicates"

- id: route-scrna-de-002
  category: routing
  prompt: "Find genes differentially expressed in COVID-19 vs healthy donor PBMC samples"
  expected_status: PERMITTED
  expected_capability: scrna.pseudobulk_de
  data_metadata:
    min_replicates_per_condition: 4
    is_integer_like: true
  description: "Disease vs healthy condition DE"

- id: route-scrna-cluster-001
  category: routing
  prompt: "Run Leiden clustering and find cluster marker genes on single cell count matrix"
  expected_status: PERMITTED
  expected_capability: scrna.exploratory_clustering
  data_metadata:
    is_integer_like: true
  description: "Single-cell exploratory manifold learning and Leiden clustering"

- id: route-scrna-cluster-002
  category: routing
  prompt: "Preprocess raw counts, perform PCA, construct neighbor graph and compute UMAP embedding"
  expected_status: PERMITTED
  expected_capability: scrna.exploratory_clustering
  data_metadata:
    is_integer_like: true
  description: "Standard scverse exploratory pipeline"

- id: route-spatial-svg-001
  category: routing
  prompt: "Detect spatially variable genes in 10x Visium tissue section using Moran's I spatial autocorrelation"
  expected_status: PERMITTED
  expected_capability: spatial.morans_svg
  data_metadata:
    n_spatial_spots: 1200
  description: "Spatial transcriptomics Moran's I SVG detection"

- id: route-spatial-svg-002
  category: routing
  prompt: "Build spatial KNN graph and identify genes with significant spatial autocorrelation in Slide-seq"
  expected_status: PERMITTED
  expected_capability: spatial.morans_svg
  data_metadata:
    n_spatial_spots: 4500
  description: "Slide-seq spatial graph and autocorrelation"

- id: route-survival-km-001
  category: routing
  prompt: "Estimate Kaplan-Meier survival curves and perform log-rank test for CD8 high vs low cohorts"
  expected_status: ABSTAIN
  expected_capability: survival.kaplan_meier
  allow_degraded: true
  data_metadata:
    simulate_missing_backend: "lifelines"
    positive_durations: true
    n_events: 42
  expected_violations:
    - "backend"
  required_remedies:
    - "pip install"
  description: "Strict capability-bound backend gate: canonical capability refuses when lifelines is missing, even with allow_degraded consent"

- id: route-scvi-vae-001
  category: routing
  prompt: "Train an scVI deep generative variational autoencoder model for batch integration across 5 donors"
  expected_status: ABSTAIN
  expected_capability: scvi.probabilistic_vae
  data_metadata:
    simulate_missing_backend: "scvi"
    is_integer_like: true
  expected_violations:
    - "backend"
  required_remedies:
    - "pip install"
  description: "Strict backend gate: default-visible skill no longer waves through a missing scvi backend (assumes scvi absent)"

- id: route-allotrope-001
  category: routing
  prompt: "Standardize multi-well spectrophotometer plate reader raw CSV export into Allotrope ASM JSON"
  expected_status: ABSTAIN
  expected_capability: allotrope.format_conversion
  data_metadata:
    simulate_missing_backend: "allotropy"
  expected_violations:
    - "backend"
  required_remedies:
    - "pip install"
  description: "Strict backend gate: canonical allotropy backend missing means refusal, never silent substitution (assumes allotropy absent)"

- id: route-nextflow-001
  category: routing
  prompt: "Generate nf-core rnaseq samplesheet and Slurm cluster config launch scripts for paired-end FASTQ directory"
  expected_status: PERMITTED
  expected_capability: nextflow.pipeline_launch
