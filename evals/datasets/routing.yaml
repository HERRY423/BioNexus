- id: route-acmg-001
  category: routing
  prompt: "Classify pathogenicity of TP53 c.524G>A (p.Arg175His) using ACMG criteria PVS1, PS1, PM1, PP3"
  expected_status: PERMITTED
  expected_capability: variant.acmg_classification
  description: "Deterministic ACMG criteria combination"

# ---- Frontier execution isolation (BNS-010 runtime gate) ----

- id: route-frontier-gears-no-optin-001
  category: routing
  prompt: "use GEARS to predict TP53 perturbation"
  expected_status: EXPERIMENTAL_CAPABILITY_REQUIRES_OPT_IN
  expected_capability: perturbation.gears_prediction
  expected_violations:
    - "opt-in"
  required_remedies:
    - "allow-frontier"
  description: "Frontier isolation: frontier capability is matched but unreachable without explicit opt-in"

- id: route-frontier-scgpt-optin-nofallback-001
  category: routing
  prompt: "extract single cell representation using scgpt"
  expected_status: ABSTAIN
  expected_capability: scfm.scgpt_canonical
  allow_frontier: true
  data_metadata:
    simulate_missing_backend: "transformers"
  expected_violations:
    - "backend"
  description: "Frontier opt-in alone does not waive the capability-bound backend gate (assumes transformers absent)"

- id: route-frontier-rankproxy-optin-001
  category: routing
  prompt: "calculate rank-value SVD embedding proxy for exploratory visualization"
  expected_status: PERMITTED
  expected_capability: scfm.rank_proxy_embedding
  allow_frontier: true
  description: "Frontier opt-in + present backend (bionexus.scfm is in-tree) -> PERMITTED under experimental track"
