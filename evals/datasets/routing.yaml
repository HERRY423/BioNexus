- id: route-scrna-de-001
  category: routing
  prompt: "Compare differential expression between drug-treated and vehicle control cells in scRNA-seq dataset"
  expected_status: PERMITTED
  expected_capability: scrna.pseudobulk_de
  data_metadata:
    min_replicates_per_condition: 3
    is_integer_like: true
  description: "Direct condition differential expression with sufficient replicates"

