# ==============================================================================
# BioNexus Benchmark: L3 Scientific Outcome & Ground Truth Recovery Suite
# ==============================================================================

- id: l3-outcome-marker-recovery-001
  level: L3
  category: scientific_outcome
  prompt: "Recover planted marker genes from synthetic single-cell PBMC counts."
  expected_status: PERMITTED
  expected_capability: scrna.exploratory_clustering
  data_metadata:
    planted_signal: "scrna_markers"
    expected_genes: ["CD3D", "MS4A1", "CD14"]
    min_recall: 0.80
  description: "L3 Outcome: Scanpy gold chain recovers planted marker genes in top ranks"

- id: l3-outcome-spatial-svg-002
  level: L3
  category: scientific_outcome
  prompt: "Recover planted spatial gradient genes from synthetic coordinates."
  expected_status: PERMITTED
  expected_capability: spatial.morans_svg
  data_metadata:
    planted_signal: "spatial_moran_svg"
    expected_genes: ["SVG_LEFT"]
    moran_i_min: 0.30
  description: "L3 Outcome: Squidpy spatial graph recovers planted spatially variable genes"

- id: l3-outcome-pseudobulk-deseq-003
  level: L3
  category: scientific_outcome
  prompt: "Recover planted condition DEGs with true fold change >= 2.0 and FDR q < 0.05."
  expected_status: PERMITTED
  expected_capability: scrna.pseudobulk_de
  data_metadata:
    planted_signal: "pseudobulk_de"
    min_replicates_per_condition: 3
    is_integer_like: true
    expected_de_genes: ["g0"]
    fdr_q_max: 0.05
  description: "L3 Outcome: PyDESeq2 pseudobulk recovers planted condition differential expression"

- id: l3-outcome-clustering-ari-stability-004
  level: L3
  category: scientific_outcome
  prompt: "Evaluate parameter robustness of Leiden clustering across resolution sweep 0.4 to 0.8."
  expected_status: PERMITTED
  expected_capability: scrna.exploratory_clustering
  data_metadata:
    planted_signal: "clustering_stability"
    target_ari_min: 0.80
  description: "L3 Outcome: Parameter perturbation audit achieves ARI >= 0.80 on stable clusters"

- id: l3-outcome-rank-concordance-005
  level: L3
  category: scientific_outcome
  prompt: "Cross-method concordance: mean-shift and rank-sum statistics must agree on planted markers."
  expected_status: PERMITTED
  expected_capability: scrna.pseudobulk_de
  data_metadata:
    planted_signal: "rank_concordance"
    min_spearman_rho: 0.85
  description: "L3 Outcome: EvidenceCard dimension 6 machinery detects agreement between independent statistics on planted signal"

- id: l3-outcome-external-validation-006
  level: L3
  category: scientific_outcome
  prompt: "Recover a planted truth set and validate predictions against it with precision and recall >= 0.80."
  expected_status: PERMITTED
  data_metadata:
    planted_signal: "external_validation"
    min_precision: 0.80
    min_recall: 0.80
  description: "L3 Outcome: EvidenceCard dimension 7 machinery recovers a planted truth set at documented thresholds"

- id: l3-outcome-egress-policy-007
  level: L3
  category: scientific_outcome
  prompt: "Enforce the data-sensitivity egress policy matrix for every tier and zone combination."
  expected_status: PERMITTED
  data_metadata:
    planted_signal: "egress_policy"
  description: "L3 Outcome: Governance layer returns the documented PERMITTED/DEGRADED_ADVISORY/ABSTAIN decision for each tier x zone"

- id: l3-outcome-survival-separation-008
  level: L3
  category: scientific_outcome
  prompt: "Recover planted hazard separation between two survival groups with the canonical log-rank test."
  expected_status: PERMITTED
  expected_capability: survival.kaplan_meier
  data_metadata:
    planted_signal: "survival_separation"
    max_p_value: 0.01
  description: "L3 Outcome: lifelines log-rank test detects planted hazard separation (skipped on minimal runners)"
