    min_replicates_per_condition: 4
    is_integer_like: true
    multiple_testing_correction: false
    claimed_maturity: SUPPORTED
  required_remedies: []
  allowed_computation: "The DE run itself (exploratory ranking until FDR-corrected values are reported)"
  forbidden_claim: "SUPPORTED findings from uncorrected p-values"
  failure_mode: BN-F005
  reference: "Benjamini & Hochberg 1995; Bunce et al. 2022 (FDR reporting)"
  description: "TRAP: missing-FDR. Genome-scale scan reported at raw p<0.05 with a SUPPORTED maturity claim; the statistical warrant must be capped at PRELIMINARY."

