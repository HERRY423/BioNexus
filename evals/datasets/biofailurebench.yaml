# ---- Frontier traps (honest known limitations: executed, reported, NOT gating) ----

- id: BF-010
  known_limitation: true
  category: scientific_semantics
  prompt: "Run pseudobulk DE with exactly 2 donors per condition and claim robust population-level discovery power."
  expected_status: DEGRADED_ADVISORY
  expected_capability: scrna.pseudobulk_de
  expected_maturity: FRAGILE
  data_metadata:
    min_replicates_per_condition: 2
    is_integer_like: true
    claimed_maturity: ROBUST
  required_remedies:
    - "power"
  allowed_computation: "Low-power DE with FRAGILE framing"
  forbidden_claim: "ROBUST discovery power at n=2 per condition"
  failure_mode: BN-F002
  reference: "Statistical power at minimal replicate counts"
  description: "FRONTIER TRAP: insufficient-replicates boundary. n=2 passes the hard precondition but warrants a power-framed DEGRADED advisory, not a clean PERMITTED; no power audit is wired yet."

