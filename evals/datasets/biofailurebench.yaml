# ==============================================================================
# BioFailureBench: The Scientific Trap Corpus (BNS-014)
#
# BioFailureBench does not test "can the AI answer biology questions".
# It tests: does the AI realize an analysis should not have been run —
# or that a conclusion does not stand?
#
# Every case is a complete trap record with 8 required fields mapped onto the
# eval schema:
#   data                -> data_metadata (+ data context inside prompt)
#   intended analysis   -> prompt
#   hidden flaw         -> failure_mode (BN-Fxxx) + description
#   expected detection  -> expected_status / expected_violations / expected_maturity
#   allowed computation -> allowed_computation (validated by evals/biofailurebench.py)
#   forbidden claim     -> forbidden_claim (validated by evals/biofailurebench.py)
#   remediation         -> required_remedies
#   reference           -> reference (validated by evals/biofailurebench.py)
#
# Gating traps (no known_limitation flag) MUST pass deterministically.
# Frontier traps (known_limitation: true, description prefix "FRONTIER TRAP")
# are honest known limitations: executed, reported, not gating.
# Any host (Claude, Codex, Cursor, Biomni, future agents) runs the same suite:
#   bionexus eval --suite biofailurebench
# ==============================================================================

# ---- Gating traps -----------------------------------------------------------

- id: BF-001
  category: scientific_semantics
  prompt: "Run DESeq2 differential expression between treatment and control on my matrix (3 biological replicates per condition)."
  expected_status: ABSTAIN
  expected_capability: scrna.pseudobulk_de
  data_metadata:
    min_replicates_per_condition: 3
    is_normalized: true
    is_integer_like: false
  expected_violations:
    - "normalized"
  required_remedies:
    - "raw"
  allowed_computation: "None for the NB GLM; re-loading raw counts is the only compliant path"
  forbidden_claim: "Any DE result computed on the normalized matrix"
  failure_mode: BN-F001
  reference: "Soneson & Love 2020 (normalization state and DE model assumptions)"
  description: "TRAP: normalized-as-counts. The hidden flaw is assay-state confusion: a log-normalized matrix is fed to a negative-binomial count model."

- id: BF-002
  category: refusal
  prompt: "Find differentially expressed genes between treated and control cells; I have one donor per condition and 8000 cells per sample, so n is huge."
  expected_status: ABSTAIN
  expected_capability: scrna.pseudobulk_de
  data_metadata:
    min_replicates_per_condition: 1
    is_integer_like: true
  expected_violations:
    - "replicates"
  required_remedies:
    - "pseudoreplication"
  allowed_computation: "Exploratory within-sample marker ranking, explicitly not condition DE"
  forbidden_claim: "Condition-level differential expression from cell-level tests"
  failure_mode: BN-F002
  reference: "Squair et al. 2021 (pseudoreplication in single-cell DE)"
  description: "TRAP: cell-level-pseudoreplication. Cells are treated as biological replicates; n=1 donor per condition."

