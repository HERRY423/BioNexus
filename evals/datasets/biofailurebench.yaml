  allowed_computation: "Exploratory within-stratum comparisons with the confounding disclosed"
  forbidden_claim: "Population-level treatment effect is identified"
  failure_mode: BN-F006
  reference: "Design confounding basics; Montgomery 'Design and Analysis of Experiments'"
  description: "TRAP: batch-condition-confounding. Condition is perfectly confounded with the batch/donor stratum."

