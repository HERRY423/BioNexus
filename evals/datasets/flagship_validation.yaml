# ==============================================================================
# BioNexus Flagship External Validation Track (BNS-015, v1.0 real-data)
# ==============================================================================
# Exactly THREE capabilities receive external validation — not a benchmark of
# twenty. Synthetic planted-signal fixtures do NOT satisfy this track: every
# case requires a real public dataset under data/flagship/<dataset_id>/ and is
# honestly SKIPPED when absent (BNS-EM-009). Fetch datasets with:
#   python evals/datasets/download_flagship_datasets.py
# ==============================================================================

# --- A. pseudobulk: BioNexus donor-aware pseudobulk vs published DE truth ---
- id: flagship-pseudobulk-kang2018-001
  level: L3
  expected_maturity: SUPPORTED
  category: scientific_outcome
  prompt: "Validate BioNexus donor-aware pseudobulk DE against the published Kang 2018 IFN-beta PBMC results."
  expected_status: PERMITTED
  expected_capability: scrna.pseudobulk_de
  data_metadata:
    flagship_suite: "pseudobulk_external_truth"
    dataset_id: "kang2018_pbmc_ifnb"
    reference_condition: "ctrl"
    contrast_level: "stim"
    top_n: 100
    min_truth_overlap: 0.5
  description: "Flagship A: cell-level public dataset -> BioNexus pseudobulk -> overlap with published DE truth (backend identity must be CONFORMANT first)"

# --- B. annotation evidence: knowing when an annotation is NOT believable ---
- id: flagship-annotation-distrust-002
  level: L3
  expected_maturity: SUPPORTED
  category: scientific_outcome
  prompt: "Determine whether BioNexus correctly distrusts under-evidenced cell annotations on CITE-seq/sorted PBMC ground truth."
  expected_status: PERMITTED
  expected_capability: scrna.annotation_evidence
  data_metadata:
    flagship_suite: "annotation_distrust"
    dataset_id: "citeseq_pbmc_sorted"
    scenarios: ["no_negative_markers", "open_set_forced", "fully_evidenced"]
  description: "Flagship B: the benchmark is distrust calibration — under-evidenced labels must not be SUPPORTED, open-set must ABSTAIN, fully-evidenced must not be over-skepticized"

