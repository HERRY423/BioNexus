name: BNS-022 neutral governance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "governance/scientific-semantics/**"
      - "scripts/validate_semantic_governance.py"
      - "spec/BNS-022-scientific-semantics-neutral-governance.md"
      - "spec/registry.yaml"
      - "src/bionexus/bctk/**"
      - "tests/unit/test_scientific_semantics_governance.py"
      - ".github/workflows/bns022-governance.yml"
  push:
    branches: [main]
    paths:
      - "governance/scientific-semantics/**"
      - "scripts/validate_semantic_governance.py"
      - "spec/BNS-022-scientific-semantics-neutral-governance.md"
      - "spec/registry.yaml"
      - "src/bionexus/bctk/**"
      - "tests/unit/test_scientific_semantics_governance.py"
      - ".github/workflows/bns022-governance.yml"

permissions:
  contents: read

jobs:
  governance-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Install the declared core runtime because pytest always imports the
      # repository-wide conftest (numpy/scipy fixtures) before collecting the
      # two focused governance modules.
      - run: python -m pip install -e . "pytest>=7.4,<10"
      - run: python scripts/validate_semantic_governance.py
      - run: pytest -q tests/unit/test_scientific_semantics_governance.py tests/unit/test_spec_registry.py
