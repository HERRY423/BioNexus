name: container

on:
  push:
    branches: [main]
    paths:
      - "container/apptainer.def"
      - "src/bionexus/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-sif:
    # Apptainer SIF images are Linux-only artifacts; they are built and
    # self-checked in CI. They cannot be built or run on Windows/macOS.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Build SIF (fails closed on image self-check)
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y apptainer || true
          apptainer --version
          APPTAINER_TMPDIR=$PWD/.apptainer-tmp apptainer build \
            --tmpdir $PWD/.apptainer-tmp \
            bionexus.sif container/apptainer.def

      - name: Image self-verification
        run: |
          set -euo pipefail
          apptainer exec bionexus.sif bionexus doctor --json > doctor.json
          python - <<'PY'
          import json
          report = json.load(open("doctor.json"))
          ready = report.get("ready", {})
          for name in ("core_ready", "scverse_ready", "spatial_ready", "survival_ready"):
              assert ready.get(name), f"container doctor missing {name}: {ready}"
          print("container doctor OK:", sorted(k for k, v in ready.items() if v))
          PY
          apptainer exec bionexus.sif bionexus preflight --help > /dev/null
          apptainer exec bionexus.sif bionexus audit --help > /dev/null
          apptainer exec bionexus.sif bionexus verify --help > /dev/null
          echo "three firewall entry points OK inside the image"

      - name: Smoke-run a gate against real data in the image
        run: |
          set -euo pipefail
          # The committed Kang 2018 cohort (8 donors, properly replicated) is a
          # real public dataset: the gate must inspect it and respond. The
          # smoke check asserts the gate RESPONDS with a known decision
          # vocabulary, not that it permits.
          apptainer exec --bind "$PWD/data:/data:ro" bionexus.sif \
            bionexus preflight /data/flagship/kang2018_pbmc_ifnb/pbmc_ifnb_counts.h5ad \
            --intent differential-expression \
            > preflight_smoke.json
          python - <<'PY'
          import json
          payload = json.load(open("preflight_smoke.json"))
          decision = payload.get("decision")
          print("smoke preflight decision:", decision)
          assert decision in ("REFUSED", "BLOCKED", "PERMITTED", "PERMITTED_WITH_LIMITS", "ALLOWED", "CAPPED"), payload
          assert payload.get("capability_id"), payload
          PY

      - name: Upload SIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: bionexus-${{ github.sha }}.sif
          path: bionexus.sif
          retention-days: 14
          if-no-files-found: error

      - name: Attach SIF to release
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" bionexus.sif --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
