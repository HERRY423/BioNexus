name: BioNexus Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.8.0)'
        required: true
        default: 'v0.8.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build, Verify & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build & Release Dependencies
        run: |
          python -m pip install --upgrade pip build wheel ruff pyyaml
          pip install -e .

      - name: Validate Multi-Platform Registry Manifests
        run: |
          python -m bionexus.cli registry --check
          python -m bionexus.cli registry --validate-endpoints

      - name: Run BioNexus Agent Reliability Benchmark
        run: |
          python -m bionexus.cli eval --report dist/benchmark_report.md

      - name: Build Python Wheels and Source Distribution
        run: |
          python -m build

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "Building release for version: $VERSION"
          python -c "
          from pathlib import Path
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          sections = changelog.split('## [')
          found = False
          notes = []
          for s in sections[1:]:
              header = s.split(']')[0]
              if header == '$VERSION':
                  notes.append('## [' + s)
                  found = True
                  break
          if found:
              Path('dist/RELEASE_NOTES.md').write_text(notes[0], encoding='utf-8')
          else:
              Path('dist/RELEASE_NOTES.md').write_text('BioNexus Release ' + '$TAG', encoding='utf-8')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BioNexus ${{ github.ref_name || github.event.inputs.tag_name }}"
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/benchmark_report.md
            plugin.json
            mcp.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
