name: BNS-019 interoperability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "standards/scientific-semantic-conventions/**"
      - "interoperability/bns019/**"
      - ".github/workflows/bns019-interoperability.yml"
  push:
    branches: [main]
    paths:
      - "standards/scientific-semantic-conventions/**"
      - "interoperability/bns019/**"
      - ".github/workflows/bns019-interoperability.yml"

permissions:
  contents: read

jobs:
  python-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: >-
          python interoperability/bns019/python/bns019_validator.py
          --standard-root standards/scientific-semantic-conventions
          --output python-result.json

  r-validator-and-seurat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install trial dependencies
        run: Rscript -e "install.packages(c('jsonlite','digest','SeuratObject'))"
      - name: Run independent R validator
        run: >-
          Rscript interoperability/bns019/r/bns019_validator.R
          --standard-root standards/scientific-semantic-conventions
          --output r-result.json
      - name: Create minimal Seurat object
        run: >-
          Rscript -e "suppressPackageStartupMessages(library(SeuratObject));
          x<-matrix(as.integer(c(1,0,0,2)),nrow=2,dimnames=list(c('G1','G2'),c('C1','C2')));
          saveRDS(CreateSeuratObject(counts=x),'seurat-input.rds',version=3)"
      - name: Run Seurat round trip
        run: >-
          Rscript interoperability/bns019/seurat/bns019_seurat_adapter.R
          --input seurat-input.rds
          --output seurat-output.rds
          --standard-root standards/scientific-semantic-conventions
          --semantics standards/scientific-semantic-conventions/conformance/valid/observation.json
          --result seurat-result.json

  scanpy-anndata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "anndata>=0.10,<0.14" "numpy>=1.24"
      - run: >-
          python interoperability/bns019/scanpy/bns019_scanpy_adapter.py
          --input tests/fixtures/tiny_scrna.h5ad
          --output scanpy-output.h5ad
          --standard-root standards/scientific-semantic-conventions
          --semantics standards/scientific-semantic-conventions/conformance/valid/observation.json
          --result scanpy-result.json

  nfcore-nextflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: nf-core/setup-nextflow@v3
        with:
          version: "24.10"
      - run: >-
          nextflow run interoperability/bns019/nf-core
          --record interoperability/bns019/trial/fixtures/workflow-record.json
          --semantics standards/scientific-semantic-conventions/conformance/valid/observation.json
          --standard_root standards/scientific-semantic-conventions
          --outdir nextflow-results
          -work-dir nextflow-work

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=7.4,<10" "jsonschema>=4.17,<6"
      - run: pytest -q tests/unit/test_bns019_interoperability.py
