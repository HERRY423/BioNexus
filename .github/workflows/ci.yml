name: BioNexus CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'

jobs:
  # --------------------------------------------------------------------------
  # 1. Code Quality & Config Integrity
  # --------------------------------------------------------------------------
  lint:
    name: Code Quality & Config Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Lint & Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.1,<1" pyyaml numpy
          pip install -e .
      - name: Run Ruff Linter
        run: ruff check .
      - name: Check Canonical Registry Drift & Validate Endpoints
        run: |
          python scripts/registry_compiler.py --check
          python scripts/registry_compiler.py --validate-endpoints

  # --------------------------------------------------------------------------
  # 2. Core Reliability Matrix: Python 3.10-3.12 x Win/macOS/Linux (Must be 100% Green)
  # --------------------------------------------------------------------------
  core-matrix:
    name: Core Reliability (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Core Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio
      - name: Run Core Unit Test Suite
        shell: bash
        run: |
          pytest tests/unit/ -v --ignore=tests/unit/test_scvi_smoke.py
      - name: Verify Core CLI & Warrant Diagnostics (Strict, No || true)
        shell: bash
        run: |
          python -m bionexus.cli --version
          python -m bionexus.cli doctor
          python -m bionexus.cli list-skills
          python -m bionexus.cli registry --check
        # L1/L2/L3 benchmark routing expectations require the canonical scientific
        # backends; they are enforced by the strict full-benchmark eval in the
        # Canonical Scientific Stack matrix (skips turn red there).

  # --------------------------------------------------------------------------
  # 3. Canonical Scientific Stack Matrix: Promised Combinations (Failures Turn Red)
  # --------------------------------------------------------------------------
  scientific-matrix:
    name: Canonical Scientific Stack (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Canonical Scientific Dependencies (Strict, No Silent Failures)
        shell: bash
        run: |
          python -m pip install --upgrade pip "setuptools<81" wheel
          pip install -r requirements-dev.txt
          pip install -e ".[dev,goldchain,spatial]"
      - name: Assert Scientific Backends Import Cleanly
        shell: bash
        run: |
          python -c "import scanpy, anndata, squidpy, pydeseq2, leidenalg, igraph; print('Canonical scientific backends loaded successfully')"
      - name: Enforce Scientific Doctor Diagnostics
        shell: bash
        run: |
          python -m bionexus.cli doctor --require-scverse --require-spatial
      - name: Run Flagship Empirical Stress Tests & Generate Artifacts
        shell: bash
        run: |
          python evals/pseudobulk_stress_test.py
          python evals/spatial_stress_test.py
          python evals/annotation_stress_test.py
          python evals/datasets/download_flagship_datasets.py --only citeseq_pbmc_sorted
          python evals/datasets/download_flagship_datasets.py --only xenium_spatial_truth
          python scripts/run_flagship_validation.py
          python scripts/verify_validation_artifacts.py

      - name: Run Complete Test Suite & Audit Validation Artifacts
        shell: bash
        run: |
          pytest tests/ -v --ignore=tests/unit/test_scvi_smoke.py
      - name: Run Strict Full Benchmark Eval (Skips Turn Red)
        shell: bash
        env:
          BIONEXUS_EVAL_STRICT: "1"
        run: |
          python -m bionexus.cli eval --level all --provider replay --strict --report evals/reports/benchmark_${{ matrix.os }}_py${{ matrix.python-version }}.md
      - name: Upload Strict Benchmark Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: evals/reports/benchmark_${{ matrix.os }}_py${{ matrix.python-version }}.md

      # Strict eval ("skips turn red") requires the canonical scientific backends
      # to be installed; it runs in the Canonical Scientific Stack matrix below,
      # where every L1/L2/L3 case can actually execute.

  # --------------------------------------------------------------------------
  # 4. Graceful Degradation Matrix: Tested As Epistemic Results, Never Shell Ignorance
  # --------------------------------------------------------------------------
  degradation-matrix:
    name: Audited Graceful Degradation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Core Only (Without Scientific Backends)
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio
      - name: Verify Doctor Accurately Reports Degraded Tier
        shell: bash
        run: |
          python -c "
          from bionexus.doctor import run_doctor
          rep = run_doctor()
          assert rep['tier'] == 'degraded', f'Expected degraded tier without scverse, got {rep[\"tier\"]}'
          assert rep['ready']['core_ready'] is True
          assert rep['ready']['scverse_ready'] is False
          print('[OK] Environment doctor accurately reports DEGRADED tier without silent crashes.')
          "
      - name: Verify Missing Backends Result in Explicit SKIPPED_NO_BACKEND (Never Fake Pass)
        shell: bash
        run: |
          pytest tests/unit/test_eval_harness.py -k "test_l3_missing_backend_never_counts_as_pass" -v
      - name: Run L3 Eval with Audited Degradation Accounting
        shell: bash
        run: |
          # L1/L2 routing expectations are verified in the core/scientific jobs.
          # This core-only job exercises the L3 missing-backend contract: every
          # unexecuted outcome remains SKIPPED_NO_BACKEND, never a pass.
          python -m bionexus.cli eval --level L3 --provider replay

  # --------------------------------------------------------------------------
  # 5. Frontier & Optional Extras Matrix
  # --------------------------------------------------------------------------
  scvi-smoke:
    name: scVI Probabilistic VAE Smoke
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install scverse extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,scverse]"
      - name: Require scvi import
        run: python -c "import scvi, torch; print(scvi.__version__, torch.__version__)"
      - name: Run scVI smoke tests
        run: pytest tests/unit/test_scvi_smoke.py -q --tb=short

  nextflow-launch:
    name: nf-core Launch Artifact Verification
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Write launch script only (does not claim preview)
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "skills/nextflow-development/scripts")
          from nfcore_launch import build_launch_command, write_launch_script
          sheet = Path("tests/_tmp_ci_samplesheet.csv")
          sheet.write_text("sample,fastq_1\ns1,a.fq.gz\n", encoding="utf-8")
          cmd = build_launch_command(pipeline="scrnaseq", samplesheet=str(sheet), outdir="results")
          dest = Path("tests/_tmp_ci_run.sh")
          write_launch_script(cmd, dest)
          text = dest.read_text(encoding="utf-8")
          assert "nf-core/scrnaseq" in text
          print(text)
          PY

  mcp-protocol:
    name: FastMCP SDK & Local Protocol
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
          pip install mcp
      - name: Verify FastMCP Server Protocol
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          from local_mcp_server import create_mcp_server
          s = create_mcp_server()
          name = getattr(s, 'name', getattr(s, '_name', 'bionexus-local-mcp'))
          assert 'bionexus' in str(name).lower() or 'bionexus' in str(s).lower()
          print('[OK] FastMCP server initialized successfully:', name)
          "
          python -c "
          import subprocess, json
          p = subprocess.Popen(['python', 'scripts/local_mcp_server.py', '--legacy'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          req = {'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {}}
          out, _ = p.communicate(json.dumps(req) + '\n', timeout=10)
          resp = json.loads(out.strip())
          assert resp['result']['serverInfo']['name'] == 'bionexus-local-mcp'
          print('[OK] Local MCP Server legacy stdio protocol PASSED.')
          "
