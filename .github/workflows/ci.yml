name: BioNexus CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'

jobs:
  lint:
    name: Code Quality & Config Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pyyaml
      - name: Run Ruff Linter
        run: ruff check .
      - name: Check Canonical Registry Drift & Validate Endpoints
        run: |
          python scripts/registry_compiler.py --check
          python scripts/registry_compiler.py --validate-endpoints

  test:
    name: Unit & Integration Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Spatial extra (Ubuntu 3.11, required)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: pip install -e ".[spatial]"
      - name: Run Pytest Test Suite
        shell: bash
        run: |
          pytest tests/ -v
      - name: Fixture gold-chain smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: python scripts/goldchain_smoke.py
      - name: Verify FastMCP SDK & Local MCP Server Protocol
        shell: bash
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          from local_mcp_server import create_mcp_server
          s = create_mcp_server()
          assert s.name == 'bio-research-local-mcp'
          print('Official FastMCP Server initialization PASSED.')
          "
          python -c "
          import subprocess, json
          p = subprocess.Popen(['python', 'scripts/local_mcp_server.py', '--legacy'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          req = {'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {}}
          out, _ = p.communicate(json.dumps(req) + '\n', timeout=10)
          resp = json.loads(out.strip())
          assert resp['result']['serverInfo']['name'] == 'bio-research-local-mcp'
          print('Local MCP Server legacy stdio protocol PASSED.')
          "

  scvi-smoke:
    name: scVI one-epoch smoke
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install scverse extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,scverse]"
      - name: Require scvi import
        run: python -c "import scvi, torch; print(scvi.__version__, torch.__version__)"
      - name: Run scVI smoke tests
        run: pytest tests/unit/test_scvi_smoke.py -q --tb=short

  nextflow-launch:
    name: nf-core launch artifact
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Write launch script only (does not claim preview)
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "skills/nextflow-development/scripts")
          from nfcore_launch import build_launch_command, write_launch_script
          sheet = Path("tests/_tmp_ci_samplesheet.csv")
          sheet.write_text("sample,fastq_1\ns1,a.fq.gz\n", encoding="utf-8")
          cmd = build_launch_command(pipeline="scrnaseq", samplesheet=str(sheet), outdir="results")
          dest = Path("tests/_tmp_ci_run.sh")
          write_launch_script(cmd, dest)
          text = dest.read_text(encoding="utf-8")
          assert "nf-core/scrnaseq" in text
          print(text)
          PY
